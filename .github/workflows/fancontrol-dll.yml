name: FanControl DLL (T Sensor fix)

# Builds LibreHardwareMonitorLib from FanControl's LHM base (Rem0o fork,
# commit 1fb25b08) plus the ASUS X870/X870E T Sensor fix, so the DLL can be
# dropped into FanControl without changing any other dependency.
on:
  push:
    branches: [fancontrol-t-sensor]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build library (x64)
        run: dotnet build LibreHardwareMonitorLib\LibreHardwareMonitorLib.csproj -c Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: LibreHardwareMonitorLib-T-Sensor-fix
          path: |
            bin/Release/x64/net10.0/LibreHardwareMonitorLib.dll
            bin/Release/x64/net8.0/LibreHardwareMonitorLib.dll
            bin/Release/x64/net472/LibreHardwareMonitorLib.dll
